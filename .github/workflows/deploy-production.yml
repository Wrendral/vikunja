name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vikunja-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Build immutable image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Git describe
        id: describe
        uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45 # v2.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set image name
        id: image-name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-name.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            RELEASE_VERSION=${{ steps.describe.outputs.describe }}
      - name: Record immutable image
        id: image
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to OVH
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install deployment files
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          scp -o BatchMode=yes deploy/production/docker-compose.override.yml "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/vikunja/docker-compose.production.override.yml"
          scp -o BatchMode=yes deploy/production/deploy.sh "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/vikunja/deploy.sh"
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" 'chmod 700 /opt/vikunja/deploy.sh'
      - name: Deploy and verify
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "/opt/vikunja/deploy.sh '$IMAGE_REF' '$SOURCE_SHA'"
